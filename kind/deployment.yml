apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx
  labels:
    app: my-nginx
    managed-by: devops-team

spec:
  replicas: 2

  selector:
    matchLabels:
      app: my-nginx
      tier: frontend

  template:
    metadata:
      labels:
        app: my-nginx
        tier: frontend
        environment: development
        version: v1

    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
